name: Build
on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nixbuild/nixbuild-action@v27
        with:
          nixbuild_token: ${{ secrets.nixbuild_token }}
          generate_summary_for: "job"
      - run: nix build
